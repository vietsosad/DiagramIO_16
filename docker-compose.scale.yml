# Nhiều instance của app sau Nginx (B4, docs/adr/0006-mo-rong-ngang-san-sang.md). Ghi đè lên docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.scale.yml up -d --build --scale app=3
#
# Nginx nhận ở cổng APP_PORT (mặc định 8080) và chia tải cho các instance; instance không mở cổng nào ra ngoài.
# Khởi động lại lần lượt từng instance không làm rơi request: xem README mục "Chạy nhiều instance".

services:
  app:
    # Nhiều bản sao: không đặt tên container cố định, không mở cổng ra máy chủ (chỉ Nginx mở)
    container_name: !reset null
    ports: !reset []
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Nhiều instance thì cache phải dùng chung: sơ đồ hai tầng, token chia sẻ chỉ trên Redis (ADR-0003, ADR-0004)
      DIAGRAMIO_CACHE_MODE: two-level
      # Tổng số kết nối CSDL không tăng theo số instance: đặt APP_POOL_SIZE = tổng / số bản sao (mặc định 12 / 3)
      SPRING_DATASOURCE_HIKARI_MAXIMUMPOOLSIZE: ${APP_POOL_SIZE:-4}
      SHUTDOWN_TIMEOUT: 20s
    # Heap tính theo RAM của container (JAVA_TOOL_OPTIONS trong Dockerfile: 75%); không giới hạn thì mỗi bản sao
    # tưởng mình có cả RAM của máy
    mem_limit: ${APP_MEMORY:-1g}
    healthcheck:
      # Readiness trên cổng quản trị, chỉ nghe 127.0.0.1 bên trong container
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 60s
    # Lâu hơn SHUTDOWN_TIMEOUT: Docker chờ tắt êm xong rồi mới SIGKILL
    stop_grace_period: 30s

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/http.conf:/etc/nginx/diagramio/http.conf:ro
      - ./deploy/nginx/server.conf:/etc/nginx/diagramio/server.conf:ro
      - ./deploy/nginx/servers.conf:/etc/nginx/diagramio/servers.conf:ro
      - ./deploy/nginx/40-diagramio-servers.sh:/docker-entrypoint.d/40-diagramio-servers.sh:ro
    networks:
      - diagramio
