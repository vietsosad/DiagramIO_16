# Phần cấp http dùng chung cho mọi cách chạy nhiều instance sau Nginx: docker-compose.scale.yml, bộ đo Kaggle
# (bench/kaggle/env.sh) và NginxFailoverE2eTest (B4, docs/adr/0006-mo-rong-ngang-san-sang.md).

server_tokens off;

# Nạp lại cấu hình (bước "đánh dấu down" của lượt khởi động lại cuốn chiếu): worker cũ mặc định đóng ngay các kết nối
# rảnh của client, nên request client gửi đúng lúc đó mất (client không tự gửi lại POST). Kết nối vừa dùng trong
# 2 giây được giữ tới khi phục vụ nốt request kế tiếp (trả kèm Connection: close). Có từ nginx 1.27.4.
keepalive_min_timeout 2s;

# Đường dẫn ghi vào body lỗi JSON: chỉ phần đầu của URI gồm các ký tự an toàn (không dấu nháy, không gạch ngược nào
# lọt vào chuỗi JSON), bỏ query string
map $request_uri $diagramio_error_path {
    "~^([A-Za-z0-9/._~%-]*)" $1;
    default "";
}

# Hai nhóm upstream cùng danh sách instance (file bao ngoài khai báo): "diagramio" giữ kết nối (keepalive),
# "diagramio_fresh" mở kết nối mới cho mỗi request. Instance đang tắt êm làm xong các request đang chạy, từ chối kết
# nối mới, còn request mới gửi vào một kết nối đã mở thì bị đóng (hoặc nhận 503) mà không được xử lý (Tomcat 10.1).
# Nginx gửi lại GET, PUT, DELETE sang instance khác, nhưng không bao giờ gửi lại POST, PATCH đã gửi đi: chúng vì vậy
# luôn đi kết nối mới, bị từ chối ngay ở bước kết nối, trước khi gửi request, và được chuyển đi an toàn.
map $request_method $diagramio_upstream {
    POST    diagramio_fresh;
    PATCH   diagramio_fresh;
    LOCK    diagramio_fresh;
    default diagramio;
}

# Một dòng mỗi request: thời điểm (giây.mili giây), mã trả cho client, thời gian xử lý, và từng lần thử tới app (nhiều
# giá trị cách nhau bằng dấu phẩy khi Nginx đã thử lại sang instance khác). Bộ đo dựng dòng thời gian của W7 từ đây.
log_format diagramio '$msec $status $request_time $request_method "$upstream_addr" "$upstream_status" '
                     '"$upstream_response_time"';
