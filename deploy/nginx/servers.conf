# Danh sách instance dùng chung cho hai khối upstream của nginx.conf (docker-compose.scale.yml). Mặc định: mọi bản sao của
# service "app", tìm qua DNS của Docker mỗi 5 giây. deploy/rolling-restart.sh tạm thay file này (bản trong container,
# /etc/nginx/diagramio-runtime/servers.conf) bằng danh sách từng bản sao, đánh dấu "down" bản đang được khởi động lại.
server app:8080 resolve max_fails=1 fail_timeout=5s;
