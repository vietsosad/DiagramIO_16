# Nginx trước nhiều instance của app trong docker-compose.scale.yml (B4, docs/adr/0006-mo-rong-ngang-san-sang.md).

worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/diagramio/http.conf;
    access_log /dev/stdout diagramio;

    # DNS của Docker: tên "app" trả về địa chỉ của mọi bản sao. Hỏi lại mỗi 5 giây nên thêm, bớt hay khởi động lại bản
    # sao không cần nạp lại Nginx (tham số resolve của server trong upstream, có từ nginx 1.27.3).
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream diagramio {
        zone diagramio 256k;
        # Gửi tới instance đang có ít request dở nhất: một instance chậm (vừa khởi động, đang dọn rác) nhận ít đi
        least_conn;
        # Danh sách instance (servers.conf): một lần lỗi kết nối thì bỏ qua instance đó 5 giây, rồi thử lại bằng chính
        # request thật (kiểm tra thụ động, max_fails=1 fail_timeout=5s)
        include /etc/nginx/diagramio-runtime/servers.conf;
        keepalive 32;
        # Ngắn hơn keep-alive của Tomcat (60 giây): kết nối rảnh luôn do Nginx đóng trước, không bao giờ gửi request
        # vào một kết nối app vừa đóng
        keepalive_timeout 30s;
    }

    # Cùng các instance, không giữ kết nối: cho POST, PATCH (http.conf)
    upstream diagramio_fresh {
        zone diagramio_fresh 256k;
        least_conn;
        include /etc/nginx/diagramio-runtime/servers.conf;
    }

    server {
        listen 8080;
        include /etc/nginx/diagramio/server.conf;
    }
}
