# Phần cấp server dùng chung (B4, docs/adr/0006-mo-rong-ngang-san-sang.md). File bao ngoài khai báo hai khối upstream
# cùng danh sách instance: "diagramio" (có keepalive) và "diagramio_fresh" (không keepalive); http.conf chọn khối theo
# phương thức.

# Lớn hơn giới hạn của app (4 MB, ADR-0005) để app tự trả 413 theo khung JSON của nó; quá 8 MB thì Nginx chặn luôn
client_max_body_size 8m;

location / {
    proxy_pass http://$diagramio_upstream;
    # Giữ kết nối tới app (với khối có keepalive): HTTP/1.1 và bỏ header Connection của client
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # App ghép địa chỉ bên ngoài (Location, shareUrl) từ các header này (server.forward-headers-strategy=framework).
    # $http_host giữ nguyên cổng client đã dùng.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-Id $request_id;

    # Instance chết hay không nhận kết nối (đang khởi động, đã tắt): thử instance khác, tối đa 2 lần. Nginx không gửi
    # lại POST, PATCH đã tới app (app có thể đã xử lý); GET, PUT, DELETE thì gửi lại. PUT đã ghi xong mà mất
    # response thì lần gửi lại nhận 409 (version đã tăng): client đọc lại sơ đồ như với mọi lần 409.
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 10s;
    # Instance ở cùng mạng phải nhận kết nối gần như tức thì; chờ lâu hơn chỉ giữ client lại
    proxy_connect_timeout 1s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
}

# Lỗi do chính Nginx sinh ra cũng theo khung JSON của API: timestamp, status, error, message, path.
# (Lỗi app trả về đi nguyên vẹn: proxy_intercept_errors mặc định tắt.)
error_page 502 @diagramio_502;
error_page 504 @diagramio_504;
error_page 413 @diagramio_413;

location @diagramio_502 {
    default_type application/json;
    return 502 '{"timestamp":"$time_iso8601","status":502,"error":"Bad Gateway","message":"No application instance answered, try again","path":"$diagramio_error_path"}';
}

location @diagramio_504 {
    default_type application/json;
    return 504 '{"timestamp":"$time_iso8601","status":504,"error":"Gateway Timeout","message":"The application did not answer in time, try again","path":"$diagramio_error_path"}';
}

location @diagramio_413 {
    default_type application/json;
    return 413 '{"timestamp":"$time_iso8601","status":413,"error":"Payload Too Large","message":"Request body must not exceed 4 MB","path":"$diagramio_error_path"}';
}
